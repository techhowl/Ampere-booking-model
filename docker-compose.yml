# Local development. Postgres only — the app runs on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ampere
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ampere_buy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampere"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
